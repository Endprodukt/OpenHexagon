# Open Hexagon: its lamp colors and its control guide (the SDK's
# docs/07-packages.md). The cabinet's own leds.cfg wins once it has lines
# for openhexagon.
openhexagon/color_map[p1_dial]      #00C0FF
openhexagon/color_map[p1_button1]   #FFE000
openhexagon/color_map[p1_button2]   #FF00C0
openhexagon/color_map[p1_button3]   #FF2000

openhexagon/voice_map[p1_dial]      rotate
openhexagon/voice_map[p1_button1]   focus
openhexagon/voice_map[p1_button2]   swap
